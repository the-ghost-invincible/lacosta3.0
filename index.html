<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Lacosta — Online Marketplace in Kenya | Shop Electronics, Fashion, Groceries</title>
    <meta name="description" content="Shop electronics, fashion, groceries, drinks and more from trusted sellers in Kenya. Fast delivery, secure checkout, and pay on delivery available." />
    <meta name="keywords" content="online shopping Kenya, ecommerce, buy electronics, fashion, groceries, drinks, marketplace" />
    <meta name="author" content="Lacosta" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:title" content="Lacosta — Online Marketplace in Kenya" />
    <meta property="og:description" content="Shop electronics, fashion, groceries, drinks and more from trusted sellers in Kenya." />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:site_name" content="Lacosta" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lacosta — Online Marketplace in Kenya" />
    <meta name="twitter:description" content="Shop electronics, fashion, groceries, drinks and more from trusted sellers in Kenya." />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Lacosta",
      "url": "https://your-domain.com",
      "description": "Online marketplace in Kenya for electronics, fashion, groceries and more",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://your-domain.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect to external image sources -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://cdn.phototourl.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
